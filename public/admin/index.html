<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidatures | Digital InPulse</title>
    <meta name="description" content="Back-office de lecture des candidatures Digital InPulse." />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/png" href="/assets/media/system/share-favicon-2026.png" />
    <link rel="stylesheet" href="/admin/styles.css" />
  </head>
  <body>
    <div id="auth-screen" class="auth-screen">
      <section class="auth-card">
        <p class="auth-badge">Digital InPulse</p>
        <h1>Login Admin</h1>
        <p>Connectez-vous à l'espace admin du site.</p>
        <button type="button" id="login-btn" class="btn btn-primary">Se connecter</button>
      </section>
    </div>

    <div id="app" class="app hidden">
      <header class="topbar">
        <div class="brand">
          <span class="brand-dot"></span>
          <div>
            <strong>Digital InPulse Admin</strong>
            <small id="status-text">Pret</small>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" id="submissions-refresh-btn" class="btn btn-ghost">Rafraichir</button>
          <button type="button" id="logout-btn" class="btn btn-ghost">Deconnexion</button>
        </div>
      </header>

      <main class="shell">
        <section class="panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Lecture seule</p>
              <h1>Candidatures soumises</h1>
            </div>
            <p id="submissions-count" class="submissions-count">Chargement...</p>
          </div>

          <div id="result-message" class="result-message hidden" role="status" aria-live="polite"></div>

          <div class="bulk-actions">
            <button type="button" id="submissions-download-all-btn" class="btn btn-primary">Tout telecharger</button>
          </div>

          <div class="submissions-toolbar">
            <label>
              Programme
              <select id="submissions-program-filter">
                <option value="all">Tous</option>
                <option value="smart_mobility">Smart Mobility</option>
              </select>
            </label>
            <label>
              Recherche
              <input id="submissions-search" type="text" placeholder="Nom, email, entreprise, reference..." />
            </label>
          </div>

          <div class="submissions-table-wrap">
            <table class="submissions-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Programme</th>
                  <th>Nom</th>
                  <th>Email</th>
                  <th>Entreprise</th>
                  <th>Region</th>
                  <th>Reference</th>
                  <th>Fichiers</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="submissions-table-body">
                <tr>
                  <td colspan="9">Aucune candidature chargee.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <section id="submission-detail" class="submission-detail hidden">
            <div class="submission-detail-head">
              <div>
                <p class="eyebrow">Dossier</p>
                <h2 id="submission-detail-title">Candidature</h2>
              </div>
              <div class="submission-detail-side">
                <div id="submission-detail-meta" class="submission-detail-meta"></div>
                <div class="submission-detail-actions">
                  <button type="button" id="submission-detail-download-btn" class="btn btn-primary">Telecharger le dossier complet</button>
                  <button type="button" id="submission-detail-delete-btn" class="btn btn-danger">Supprimer la candidature</button>
                </div>
              </div>
            </div>

            <div class="submission-detail-grid">
              <div>
                <h3>Informations</h3>
                <div id="submission-detail-fields" class="submission-detail-list"></div>
              </div>
              <div>
                <h3>Pieces jointes</h3>
                <div id="submission-detail-files" class="submission-detail-list"></div>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script type="module" src="/admin/app.js"></script>
  </body>
</html>
